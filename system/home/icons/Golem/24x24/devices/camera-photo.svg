<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef0f3"/><stop offset="1" stop-color="#c2c6cd"/></linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9dce1"/><stop offset="1" stop-color="#a7acb5"/></linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <filter id="bevel" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="-.6" stdDeviation="0" flood-color="#fff" flood-opacity=".5"/>
      <feDropShadow dx="0" dy="1.6" stdDeviation="1" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <mask id="sym" maskUnits="userSpaceOnUse" x="-3" y="-3" width="30" height="30">
      <g transform="translate(12 12) scale(0.9704) translate(-12.000 -12.000)">
      <rect x="8.4" y="4.2" width="7.2" height="4.4" rx="1.6" fill="#fff" stroke="#fff" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
      <rect x="3" y="6.8" width="18" height="13" rx="3" fill="#fff" stroke="#fff" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="12" cy="13.3" r="3.9" fill="#000" stroke="#000" stroke-width="0.4" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="12" cy="13.3" r="2" fill="#fff" stroke="#fff" stroke-width="0.3" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="17.6" cy="9.8" r=".2" fill="#fff" stroke="#fff" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round"/>
      </g>
    </mask>
  </defs>
  <g transform="translate(9 7)">
    <rect fill="url(#front)" filter="url(#bevel)" x="0" y="0" width="46" height="50" rx="6"/>
    <rect fill="url(#gloss)" x="0" y="0" width="46" height="50" rx="6"/>
    <circle fill="#7fd18b" cx="39" cy="43.5" r="1.5"/>
  </g>
  <g transform="translate(12.56 14.06) scale(1.62)">
    <rect x="-3" y="-3" width="30" height="30" fill="#fff" opacity="0" mask="url(#sym)" transform="translate(0 .75)"/>
    <rect x="-3" y="-3" width="30" height="30" fill="#8e939c" mask="url(#sym)"/>
  </g>
</svg>
